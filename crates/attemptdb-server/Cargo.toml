attemptdb-adapters = { workspace = true }
attemptdb-project = { workspace = true }
attemptdb-query = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
getrandom = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
