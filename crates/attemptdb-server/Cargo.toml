[package]
name = "attemptdb-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "AttemptDB sync server: authenticated per-tenant ingest over HTTP (RFC 0006 §10), one database per tenant"

[[bin]]
name = "attemptdb-server"
path = "src/main.rs"

[dependencies]
attemptdb-core = { workspace = true }
