[package]
name = "attempt-hook"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "development-tools"]
description = "AttemptDB hook entrypoint: the smallest executable that can hand an agent event to the local database"

[[bin]]
name = "attempt-hook"
path = "src/main.rs"

[dependencies]
attemptdb-capture = { workspace = true }

# The icon and version information Windows shows for the executable. Host
# gated: build scripts compile for the host, and the Windows binaries are
# built on Windows runners.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"
