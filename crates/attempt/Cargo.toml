[package]
# The package is `attemptdb` (crates.io `attempt` belongs to an unrelated
# crate); the binary it installs is `attempt`, so `cargo install attemptdb`
# puts `attempt` on the PATH.
name = "attemptdb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "development-tools", "database-implementations"]
readme = "README.md"
description = "AttemptDB command-line interface: the database for what AI coding agents tried"

[[bin]]
name = "attempt"
path = "src/main.rs"

[dependencies]
attemptdb-core = { workspace = true }
attemptdb-storage = { workspace = true }
attemptdb-adapters = { workspace = true }
attemptdb-capture = { workspace = true }
attemptdb-query = { workspace = true }
attemptdb-project = { workspace = true }
attemptdb-mcp = { workspace = true }
attemptdb-ui = { workspace = true }
clap = { workspace = true }
ureq = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
comfy-table = { workspace = true }
chrono = { workspace = true }
toml_edit = { workspace = true }
terminal_size = "0.4"

[dev-dependencies]
tempfile = { workspace = true }
attemptdb-server = { workspace = true }

# The icon and version information Windows shows for the executable. Host
# gated: build scripts compile for the host, and the Windows binaries are
# built on Windows runners.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"
