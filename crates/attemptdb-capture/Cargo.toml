[package]
name = "attemptdb-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Capture runtime: spool, IPC protocol, daemon ingest, installer, doctor"

[dependencies]
attemptdb-core = { workspace = true }
attemptdb-storage = { workspace = true }
attemptdb-adapters = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
crc32c = { workspace = true }
dirs = { workspace = true }
toml_edit = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
zeroize = { workspace = true }
keyring = { workspace = true }
argon2 = { workspace = true }
ureq = { workspace = true }
# Reuse the workspace's HTTP stack; no new SDK, protobuf or gRPC dependency.
axum = { workspace = true }

# Peer credentials (`getuid`) and process liveness (`kill(pid, 0)`) for the
# Unix socket transport. Already in the dependency graph transitively.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Already in the graph. Stable Rust cannot disable inherited Windows
# handles when spawning a detached process; use the native API explicitly.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = { workspace = true }
# End-to-end sync test runs a real server in-process.
attemptdb-server = { path = "../attemptdb-server" }
# spec/inference-v1.schema.json must not drift from the uploader.
jsonschema = { version = "0.26", default-features = false }
