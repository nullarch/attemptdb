# attemptdb-server behind Caddy (automatic TLS). One VM, one persistent
# volume; the server itself speaks plain HTTP on the internal network.
#
#   ATTEMPTDB_ADMIN_TOKEN=$(openssl rand -hex 32) \
#   ATTEMPTDB_DOMAIN=sync.example.com \
#   docker compose -f deploy/docker-compose.yml up -d
services:
  attemptdb-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.source
    image: attemptdb-server:local
    restart: unless-stopped
    environment:
      ATTEMPTDB_ADMIN_TOKEN: ${ATTEMPTDB_ADMIN_TOKEN:?set ATTEMPTDB_ADMIN_TOKEN}
      ATTEMPTDB_CAPTURE_MODE: ${ATTEMPTDB_CAPTURE_MODE:-metadata_only}
      # The rate limits are per client address, and the address comes from
      # this header. Caddy overwrites it with the address it saw (deploy/Caddyfile),
      # so a client cannot choose its own bucket. Without this line the server
      # would believe `fly-client-ip`, which nothing in front of it sets here
      # and any client can send.
      ATTEMPTDB_CLIENT_IP_HEADER: x-forwarded-for
    volumes:
      - attemptdb-data:/data
    # Not published on the host: only Caddy reaches it.
    expose:
      - "8787"
    stop_grace_period: 30s

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ATTEMPTDB_DOMAIN: ${ATTEMPTDB_DOMAIN:?set ATTEMPTDB_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  attemptdb-data:
  caddy-data:
  caddy-config:
