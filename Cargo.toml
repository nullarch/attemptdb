[workspace]
resolver = "3"
members = [
    "crates/attemptdb-core",
    "crates/attemptdb-storage",
    "crates/attemptdb-adapters",
    "crates/attemptdb-capture",
    "crates/attemptdb-query",
    "crates/attemptdb-project",
    "crates/attemptdb-mcp",
    "crates/attemptdb-ui",
    "crates/attemptdb-server",
    "crates/attempt",
    "crates/attemptdb-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/nullarch/attemptdb"
authors = ["AttemptDB contributors"]

[workspace.dependencies]
attemptdb-core = { path = "crates/attemptdb-core" }
attemptdb-storage = { path = "crates/attemptdb-storage" }
attemptdb-adapters = { path = "crates/attemptdb-adapters" }
attemptdb-capture = { path = "crates/attemptdb-capture" }
attemptdb-query = { path = "crates/attemptdb-query" }
attemptdb-project = { path = "crates/attemptdb-project" }
attemptdb-mcp = { path = "crates/attemptdb-mcp" }
attemptdb-ui = { path = "crates/attemptdb-ui" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
thiserror = "2"
crc32c = "0.6"
fs4 = { version = "1", features = ["sync"] }
dirs = "6"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "signal"] }
datafusion = { version = "55", default-features = false, features = ["sql", "nested_expressions", "datetime_expressions", "string_expressions", "regex_expressions", "unicode_expressions"] }
arrow = "59"
tempfile = "3"
toml_edit = "0.25"
sha2 = "0.10"
hex = "0.4"
interprocess = { version = "2", features = ["tokio"] }
zstd = "0.13"
comfy-table = "7"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
# Encrypted content blobs (RFC 0006 §7): AEAD, key derivation, keyed hashes,
# randomness, and OS key stores.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hkdf = "0.12"
hmac = "0.12"
getrandom = "0.3"
zeroize = "1"
keyring = "4"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
