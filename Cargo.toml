[workspace]
resolver = "3"
members = [
    "crates/attemptdb-core",
    "crates/attemptdb-storage",
    "crates/attemptdb-adapters",
    "crates/attemptdb-capture",
    "crates/attemptdb-query",
    "crates/attemptdb-project",
    "crates/attemptdb-mcp",
    "crates/attemptdb-ui",
    "crates/attemptdb-server",
    "crates/attempt",
    "crates/attempt-hook",
    "crates/attemptdb-bench",
]

[workspace.package]
version = "0.2.6"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/nullarch/attemptdb"
homepage = "https://github.com/nullarch/attemptdb"
authors = ["AttemptDB contributors"]
# crates.io search surface. Keywords: at most 5, at most 20 characters each.
keywords = ["ai-agents", "observability", "claude-code", "local-first", "database"]
categories = ["development-tools", "database-implementations"]

[workspace.dependencies]
attemptdb-core = { path = "crates/attemptdb-core", version = "0.2.6" }
attemptdb-storage = { path = "crates/attemptdb-storage", version = "0.2.6" }
attemptdb-adapters = { path = "crates/attemptdb-adapters", version = "0.2.6" }
attemptdb-capture = { path = "crates/attemptdb-capture", version = "0.2.6" }
attemptdb-query = { path = "crates/attemptdb-query", version = "0.2.6" }
attemptdb-project = { path = "crates/attemptdb-project", version = "0.2.6" }
attemptdb-mcp = { path = "crates/attemptdb-mcp", version = "0.2.6" }
attemptdb-ui = { path = "crates/attemptdb-ui", version = "0.2.6" }
attemptdb-server = { path = "crates/attemptdb-server", version = "0.2.6" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
thiserror = "2"
crc32c = "0.6"
fs4 = { version = "1", features = ["sync"] }
dirs = "6"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "signal"] }
datafusion = { version = "55", default-features = false, features = ["sql", "nested_expressions", "datetime_expressions", "string_expressions", "regex_expressions", "unicode_expressions"] }
arrow = "59"
tempfile = "3"
toml_edit = "0.25"
sha2 = "0.10"
hex = "0.4"
interprocess = { version = "2", features = ["tokio"] }
zstd = "0.13"
comfy-table = "7"
tokio-stream = "0.1"
futures-core = "0.3"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
# Encrypted content blobs (RFC 0006 §7): AEAD, key derivation, keyed hashes,
# randomness, and OS key stores.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hkdf = "0.13"
hmac = "0.12"
getrandom = "0.3"
zeroize = "1"
keyring = "4"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
# Sync client (RFC 0006 §10). rustls via the `tls` feature: no OpenSSL, one
# static binary on every platform.
ureq = { version = "2", default-features = false, features = ["tls"] }
axum = { version = "0.8", default-features = false, features = ["form", "http1", "tokio", "json", "query"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

# The server image is built on every deploy, on a builder with a fraction of
# a laptop's single-core speed. `release` above spends its time where a CLI
# that users download earns it back — thin LTO over ~400 crates and a
# single codegen unit for the final crate — and that step alone took 13–22
# minutes per deploy on Fly's builder (one crate compiled, the rest cached).
# The server does not need that: same optimisation level, parallel codegen,
# no cross-crate LTO. Measured locally: 1m48s → well under a minute.
[profile.server]
inherits = "release"
lto = false
codegen-units = 16
