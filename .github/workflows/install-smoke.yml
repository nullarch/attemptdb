name: Install and sync smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-smoke.yml'
      - 'tests/installers/platform_smoke.py'
      - 'docs/migration/vibemon-install.*'

permissions:
  contents: read

jobs:
  smoke:
    name: real install (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { name: windows-x86_64, os: windows-2022, target: x86_64-pc-windows-msvc }
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
          cache-on-failure: true
      - name: Build a real isolated sync server
        run: cargo build --locked -p attemptdb-server --target ${{ matrix.target }}
      - name: Start the Linux user service manager
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Install published binaries, capture and sync through the OS service
        shell: bash
        run: |
          server="target/${{ matrix.target }}/debug/attemptdb-server"
          [ "${{ runner.os }}" != Windows ] || server="$server.exe"
          python tests/installers/platform_smoke.py --server "$server"
      - name: Windows PowerShell failure gates
        if: runner.os == 'Windows'
        run: powershell -NoProfile -File tests/installers/test_vibemon_install.ps1
      - name: Failure reports reach the local receiver
        run: python -m unittest discover -s tests/installers -p test_reports.py -v
      - name: Preserve synthetic diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-smoke-${{ matrix.name }}
          path: install-smoke-results/
          if-no-files-found: ignore
          retention-days: 7
