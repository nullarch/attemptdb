name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Pinned so a new Rust release cannot break main on its own. Bump
  # deliberately, with the clippy fixes the bump requires in the same commit.
  RUST_TOOLCHAIN: "1.98.0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # linux-x86_64 died with `ld terminated with signal 7 [Bus error]`: lld mmaps
  # the output file and takes SIGBUS when the filesystem fills under it. Full
  # debug info for a DataFusion-sized tree is what fills it. Line tables keep
  # the file:line detail the crash suite's backtraces rely on, at a fraction of
  # the size.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64,   os: macos-15,       target: aarch64-apple-darwin }
          - { name: macos-x86_64,  os: macos-15-intel,       target: x86_64-apple-darwin }
          - { name: linux-x86_64,  os: ubuntu-24.04,   target: x86_64-unknown-linux-gnu }
          - { name: linux-arm64,   os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { name: windows-x86_64, os: windows-2022,  target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      # Reclaim the ~20 GB of preinstalled toolchains this project never uses.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: test
        run: cargo test --workspace --target ${{ matrix.target }}
      - name: build the CLI for the smoke test
        run: cargo build -p attempt --target ${{ matrix.target }}

      - name: smoke (init → hook → timeline → snapshot)
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/debug/attempt"
          [ "${{ runner.os }}" = "Windows" ] && BIN="$BIN.exe"
          export ATTEMPTDB_DATA_DIR="$RUNNER_TEMP/attemptdb-smoke"
          "$BIN" init --source ci
          printf '%s' '{"hook_event_name":"UserPromptSubmit","session_id":"ci","cwd":"'"$PWD"'","prompt":"smoke"}' | "$BIN" hook claude-code
          printf '%s' '{"hook_event_name":"PostToolUse","session_id":"ci","cwd":"'"$PWD"'","tool_name":"Bash","tool_use_id":"t1","tool_input":{"command":"true"},"tool_response":{"stdout":""}}' | "$BIN" hook claude-code
          printf '%s' '{"hook_event_name":"Stop","session_id":"ci","cwd":"'"$PWD"'","stop_hook_active":false}' | "$BIN" hook claude-code
          "$BIN" status
          "$BIN" timeline --all-projects
          "$BIN" query "SELECT kind, count(*) FROM events GROUP BY 1 ORDER BY 1"
          "$BIN" verify
          "$BIN" snapshot export "$RUNNER_TEMP/smoke.atdb"
          "$BIN" --snapshot "$RUNNER_TEMP/smoke.atdb" query "SELECT count(*) FROM events"

  musl:
    name: build (linux-musl static)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p attempt --target x86_64-unknown-linux-musl
      - run: ldd target/x86_64-unknown-linux-musl/release/attempt || true

  msrv:
    name: msrv (rust-version in Cargo.toml)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Must match [workspace.package] rust-version. The pinned CI
          # toolchain above is newer; this job is what makes the declared
          # minimum an actually tested claim rather than a comment.
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --workspace --all-targets --locked
