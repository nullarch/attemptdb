version: 2
updates:
  # The binary must stay a single self-contained executable, so dependency
  # changes are reviewed rather than merged automatically. Grouped so the
  # workspace gets one pull request a week, not twenty.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      rust-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
